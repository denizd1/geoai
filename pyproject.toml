[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai"
version = "3.2.0"
description = "Geophysical AI target detection: multi-layer fusion, prospectivity modeling and ranked drill targets"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["geophysics", "prospectivity", "mineral exploration", "groundwater",
            "geothermal", "machine learning", "surfer", "geosoft", "geotiff"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.2",
    "matplotlib>=3.5",
    "joblib>=1.1.1",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.2"]
pillow = ["Pillow>=8.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
geoai = "geoai.cli:main"

[tool.setuptools.packages.find]
include = ["geoai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: uçtan uca, uzun süren testler (seçmek için: -m slow, atlamak için: -m 'not slow')",
]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["pdf"]

[tool.ruff.lint]
# Pyflakes (F) + sözdizimi/çalışma zamanı hataları (E9): stil yerine doğruluk kontrolü
select = ["E9", "F"]
